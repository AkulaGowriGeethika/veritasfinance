<body>

<h2>Generate Financial Report</h2>

<form action="report" method="post">

<input type="number" name="monthlyIncome"><br><br>

Monthly Savings<br>
<input type="number" name="monthlySavings"><br><br>

Bill Payment Status<br>
<input type="text" name="billPaymentStatus"><br><br>

Loan Status<br>
<input type="text" name="loanStatus"><br><br>

Income Score<br>
<input type="number" name="incomeScore"><br><br>

Savings Score<br>
<input type="number" name="savingsScore"><br><br>

Payment Score<br>
<input type="number" name="paymentScore"><br><br>

Debt Score<br>
<input type="number" name="debtScore"><br><br>

Total Score<br>
<input type="number" name="totalScore"><br><br>

<input type="submit" value="Generate Report">

</form>
