<!DOCTYPE html>
<html>
<head>

<title>Fraud Detection</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">

<link rel="stylesheet" href="sidebar.css">
<style>

body{
font-family:Arial;
background:#eef3fb;
padding:40px;
}

.container{
max-width:700px;
margin:auto;
background:white;
padding:35px;
border-radius:12px;
box-shadow:0 5px 15px rgba(0,0,0,.2);
}

h1{
text-align:center;
color:#1d5fbf;
margin-bottom:30px;
}

label{
display:block;
margin-top:18px;
font-weight:bold;
}

input,select{
width:100%;
padding:12px;
margin-top:8px;
border-radius:8px;
border:1px solid #ccc;
font-size:16px;
}

button{
margin-top:30px;
width:100%;
padding:14px;
background:#1d5fbf;
color:white;
border:none;
border-radius:8px;
font-size:18px;
cursor:pointer;
}

button:hover{
background:#174c99;
}

a{
display:block;
text-align:center;
margin-top:25px;
text-decoration:none;
color:#1d5fbf;
font-weight:bold;
}

</style>

<link rel="stylesheet" href="veritasfinance-design.css">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
<link rel="stylesheet" href="sidebar.css">
<link rel="stylesheet" href="vf-app.css">
</head>


<body>

<div class="container">

<h1>AI Fraud Detection</h1>

<form action="fraud" method="post">

<label>Actual Monthly Income</label>
<input type="number" name="actualIncome" required>

<label>Claimed Monthly Income</label>
<input type="number" name="claimedIncome" required>

<label>Aadhaar Verified</label>
<select name="aadhaar">
<option value="Yes">Yes</option>
<option value="No">No</option>
</select>

<label>PAN Verified</label>
<select name="pan">
<option value="Yes">Yes</option>
<option value="No">No</option>
</select>

<button type="submit">
Check Fraud Risk
</button>

</form>

<a href="dashboard.html">Back to Dashboard</a>

</div>

<script src="veritasfinance-sidebar.js"></script>
</body>
</html>
