<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>My Profile</title>

<style>

body{
    font-family:Arial;
    background:#f4f7fc;
}

.container{

    width:650px;
    margin:40px auto;
    background:white;
    padding:30px;
    border-radius:10px;
    box-shadow:0 0 10px rgba(0,0,0,.2);

}

h2{

    text-align:center;
    color:#1e5fb3;

}

table{

    width:100%;
    border-collapse:collapse;

}

td{

    padding:12px;
    border-bottom:1px solid #ddd;

}

.label{

    font-weight:bold;
    width:200px;

}

</style>

<link rel="stylesheet" href="veritasfinance-design.css">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
<link rel="stylesheet" href="sidebar.css">
<link rel="stylesheet" href="vf-app.css">
</head>

<body>

<div class="container">

<h2>My Profile</h2>

<table>

<tr>
<td class="label">Full Name</td>
<td id="fullName"></td>
</tr>

<tr>
<td class="label">Email</td>
<td id="email"></td>
</tr>

<tr>
<td class="label">Phone</td>
<td id="phone"></td>
</tr>

<tr>
<td class="label">Language</td>
<td id="language"></td>
</tr>

<tr>
<td class="label">Voice Enabled</td>
<td id="voice"></td>
</tr>

</table>

</div>

<script src="js/profile.js"></script>

<script src="veritasfinance-sidebar.js"></script>
</body>
</html>
