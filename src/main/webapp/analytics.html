<!DOCTYPE html>
<html>

<head>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Financial Analytics</title>

<style>

* {
    box-sizing: border-box;
}

body {
    font-family: Arial, sans-serif;
    background: #eef3fb;
    margin: 0;
    padding: 18px 20px 40px;
    color: #222;
}

.container {
    max-width: 1000px;
    margin: auto;
}

h1 {
    text-align: center;
    color: #1d5fbf;
    font-size: 36px;
    margin-bottom: 35px;
}

.form-card {
    background: white;
    max-width: 560px;
    margin: auto;
    padding: 30px;
    border-radius: 15px;
    box-shadow: 0 5px 18px rgba(0,0,0,0.15);
}

label {
    display: block;
    color: #1d5fbf;
    font-weight: bold;
    margin-bottom: 8px;
    margin-top: 18px;
}

input {
    width: 100%;
    padding: 14px;
    border: 1px solid #ccc;
    border-radius: 9px;
    font-size: 17px;
    outline: none;
}

input:focus {
    border-color: #1d5fbf;
    box-shadow: 0 0 5px rgba(29,95,191,0.25);
}

button {
    width: 100%;
    margin-top: 25px;
    padding: 14px;
    border: none;
    border-radius: 9px;
    background: #1d5fbf;
    color: white;
    font-size: 17px;
    font-weight: bold;
    cursor: pointer;
}

button:hover {
    background: #164d9c;
}

.demo {
    text-align: center;
    margin-top: 15px;
    color: #666;
    font-size: 14px;
}

.results {
    display: flex;
    justify-content: center;
    gap: 20px;
    flex-wrap: wrap;
    margin-top: 40px;
}

.card {
    background: white;
    width: 220px;
    min-height: 150px;
    padding: 25px;
    border-radius: 13px;
    box-shadow: 0 5px 15px rgba(0,0,0,0.12);
    text-align: center;
}

.card h2 {
    color: #1d5fbf;
    font-size: 19px;
}

.card p {
    font-size: 25px;
    font-weight: bold;
    margin-top: 20px;
}

.advice {
    background: white;
    max-width: 500px;
    margin: 25px auto;
    padding: 25px;
    border-radius: 13px;
    box-shadow: 0 5px 15px rgba(0,0,0,0.12);
    text-align: center;
}

.advice h2 {
    color: #1d5fbf;
}

.buttons {
    text-align: center;
    margin-top: 25px;
}

.buttons a {
    display: inline-block;
    padding: 12px 20px;
    margin: 7px;
    background: #1d5fbf;
    color: white;
    text-decoration: none;
    border-radius: 8px;
}

</style>

<link rel="stylesheet" href="veritasfinance-design.css?v=20261126">
<link rel="stylesheet" href="vf-app.css?v=20261126">
</head>

<body>
<div class="container">

<h1>Financial Analytics</h1>

<div class="form-card">

<form action="analytics" method="post" onsubmit="return validateForm()">

<label for="monthlyIncome">
Monthly Income
</label>

<input
    type="number"
    id="monthlyIncome"
    name="monthlyIncome"
    placeholder="Enter Monthly Income"
    min="1"
    step="0.01"
    required
>

<label for="monthlySavings">
Monthly Savings
</label>

<input
    type="number"
    id="monthlySavings"
    name="monthlySavings"
    placeholder="Enter Monthly Savings"
    min="0"
    step="0.01"
    required
>

<button type="submit">
Analyze Financial Health
</button>

</form>

<div class="demo">
Example: Income ₹50,000 and Savings ₹15,000
</div>

</div>

<div class="results">

<div class="card">
<h2>Income</h2>
<p>--</p>
</div>

<div class="card">
<h2>Savings</h2>
<p>--</p>
</div>

<div class="card">
<h2>Financial Health</h2>
<p>--</p>
</div>

</div>

<div class="advice">

<h2>AI Advice</h2>

<p>
Enter your income and savings to receive personalized financial guidance.
</p>

</div>

<div class="buttons">

<a href="dashboard.html">
Back to Dashboard
</a>

</div>

</div>

<script>

function validateForm() {

    const income =
        parseFloat(document.getElementById("monthlyIncome").value);

    const savings =
        parseFloat(document.getElementById("monthlySavings").value);

    if (income <= 0) {
        alert("Please enter a valid monthly income.");
        return false;
    }

    if (savings < 0) {
        alert("Savings cannot be negative.");
        return false;
    }

    if (savings > income) {
        alert("Monthly savings cannot be greater than monthly income.");
        return false;
    }

    return true;
}

</script>
<script src="veritasfinance-sidebar.js?v=20261126"></script>
</body>

</html>
