<!DOCTYPE html>
<html>

<head>

<meta charset="UTF-8">

<title>Financial Details | VeritasFinance</title>

<style>

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: #eef3fb;
    color: #222;
}

.header {
    background: linear-gradient(135deg, #1769d1, #4d8ff5);
    color: white;
    text-align: center;
    padding: 45px 20px;
}

.header h1 {
    margin: 0;
    font-size: 38px;
}

.header p {
    margin-top: 10px;
    font-size: 17px;
}

.container {
    width: 500px;
    max-width: 90%;
    margin: 40px auto;
    background: white;
    padding: 35px;
    border-radius: 16px;
    box-shadow: 0 8px 25px rgba(0,0,0,0.12);
}

h2 {
    text-align: center;
    color: #1769d1;
    margin-bottom: 30px;
}

label {
    display: block;
    font-weight: bold;
    color: #1769d1;
    margin-top: 20px;
    margin-bottom: 8px;
}

input,
select {
    width: 100%;
    padding: 13px;
    border: 1px solid #ccd4e0;
    border-radius: 8px;
    font-size: 15px;
    outline: none;
}

input:focus,
select:focus {
    border-color: #1769d1;
    box-shadow: 0 0 5px rgba(23,105,209,0.2);
}

button {
    width: 100%;
    margin-top: 30px;
    padding: 14px;
    border: none;
    border-radius: 8px;
    background: #1769d1;
    color: white;
    font-size: 17px;
    font-weight: bold;
    cursor: pointer;
}

button:hover {
    background: #1255aa;
}

.note {
    margin-top: 20px;
    padding: 15px;
    background: #f1f6ff;
    border-radius: 8px;
    font-size: 13px;
    color: #555;
    line-height: 1.5;
}

.back {
    display: block;
    text-align: center;
    margin-top: 20px;
    color: #1769d1;
    text-decoration: none;
    font-weight: bold;
}

</style>

<link rel="stylesheet" href="veritasfinance-design.css">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
<link rel="stylesheet" href="sidebar.css">
<link rel="stylesheet" href="vf-app.css">
</head>

<body>

<div class="header">

    <h1>VeritasFinance</h1>

    <p>Build your Privacy-First Financial Identity</p>

</div>


<div class="container">

    <h2>Financial Details</h2>

    <form action="upload" method="post">

        <label for="income">
            Monthly Income
        </label>

        <input
            type="number"
            id="income"
            name="income"
            placeholder="Enter your monthly income"
            min="0"
            step="0.01"
            required
        >


        <label for="savings">
            Monthly Savings
        </label>

        <input
            type="number"
            id="savings"
            name="savings"
            placeholder="Enter your monthly savings"
            min="0"
            step="0.01"
            required
        >


        <label for="bill">
            Bill Payment Behaviour
        </label>

        <select id="bill" name="bill" required>

            <option value="On Time">
                On Time
            </option>

            <option value="Late">
                Late
            </option>

        </select>


        <label for="loan">
            Current Loan Status
        </label>

        <select id="loan" name="loan" required>

            <option value="No Loan">
                No Loan
            </option>

            <option value="Active Loan">
                Active Loan
            </option>

        </select>


        <button type="submit">
            Generate Trust Score
        </button>

    </form>


    <div class="note">

        🔒 Your financial information is used to build
        your Financial Trust Profile and improve loan
        eligibility assessment.

    </div>


    <a class="back" href="dashboard.html">
        ← Back to Dashboard
    </a>

</div>

<script src="veritasfinance-sidebar.js"></script>
</body>

</html>
